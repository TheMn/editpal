<template>
  <style>
    /*BRAND*/
    #root { position: absolute; inset: 0; font-family: var(--font-text); }
    #{{id}}-box { position: absolute; top: calc(var(--u) * 16); inset-inline-end: calc(var(--w) * var(--margin));
      max-width: calc(var(--w) * 36); background: var(--c-ink); color: var(--c-ground); overflow: hidden;
      border-radius: calc(var(--w) * var(--radius)); padding: calc(var(--u) * 2.6) calc(var(--u) * 3.4) calc(var(--u) * 3.2); }
    #root.start #{{id}}-box { inset-inline-end: auto; inset-inline-start: calc(var(--w) * var(--margin)); }
    #{{id}}-txt { font-size: calc(var(--u) * var(--s-headline)); font-weight: var(--display-weight); line-height: 1.12; letter-spacing: var(--tracking); text-wrap: balance; }
    #{{id}}-rule { position: absolute; inset-inline: 0; bottom: 0; height: calc(var(--u) * 0.9); background: var(--c-accent); transform-origin: left center; }
    #root[dir="rtl"] #{{id}}-rule { transform-origin: right center; }
  </style>
  <div id="root" data-composition-id="{{id}}" data-width="{{W}}" data-height="{{H}}" lang="{{lang}}" dir="{{dir}}"
       data-composition-variables='[{"id":"text","type":"string","label":"Phrase","default":"One short phrase"},{"id":"side","type":"enum","label":"Side","default":"end","options":[{"value":"end","label":"Reading end"},{"value":"start","label":"Reading start"}]}]'>
    <div id="{{id}}-box" class="clip" data-start="0" data-duration="{{dur}}">
      <div id="{{id}}-txt" data-var-text="text">One short phrase</div>
      <div id="{{id}}-rule"></div>
    </div>
  </div>
  <script>
    (function () {
      const D = {{dur}}, S = "{{dir}}" === "rtl" ? -1 : 1, id = "{{id}}";
      const v = Object.assign({ text: "One short phrase", side: "end" }, window.__hyperframes.getVariables());
      document.getElementById(id + "-txt").textContent = v.text;
      if (v.side === "start") document.getElementById("root").classList.add("start");
      const dirn = (v.side === "start" ? -1 : 1) * S;
      const tl = gsap.timeline({ paused: true });
      const ein = "{{ease_in}}", eout = "{{ease_out}}", en = {{enter}}, ex = {{exit}};
      tl.fromTo("#" + id + "-box", { clipPath: dirn > 0 ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)", x: 50 * dirn }, { clipPath: "inset(0 0 0 0)", x: 0, duration: en, ease: ein }, 0.1);
      tl.fromTo("#" + id + "-txt", { opacity: 0 }, { opacity: 1, duration: en * 0.6, ease: "power2.out" }, 0.25);
      tl.fromTo("#" + id + "-rule", { scaleX: 0 }, { scaleX: 1, duration: en, ease: ein }, 0.4);
      tl.to("#" + id + "-box", { opacity: 0, duration: ex, ease: eout }, D - ex - 0.05);
      window.__timelines[id] = tl;
    })();
  </script>
</template>

<template>
  <style>
    /*BRAND*/
    #root { position: absolute; inset: 0; font-family: var(--font-text); }
    #root[lang="fa"] { --cap-fam: "EPPersian","EPLatin",sans-serif; }
    .{{id}}-g { position: absolute; inset-inline: 0; bottom: calc(var(--u) * var(--cap-position)); display: flex; justify-content: center; opacity: 0; visibility: hidden; }
    .{{id}}-l { max-width: calc(var(--w) * var(--cap-max-width)); text-align: center; font-size: calc(var(--u) * var(--cap-size)); font-weight: var(--cap-weight);
      line-height: 1.18; color: var(--cap-color); -webkit-text-stroke: calc(var(--u) * var(--cap-outline) * 1.3) var(--c-scrim); paint-order: stroke fill; letter-spacing: 0; text-wrap: balance; }
    .{{id}}-l.box { background: var(--cap-background); -webkit-text-stroke: 0; padding: calc(var(--u) * 0.8) calc(var(--u) * 1.8); border-radius: calc(var(--w) * var(--radius)); }
    .{{id}}-w { display: inline-block; white-space: pre; }
  </style>
  <div id="root" data-composition-id="{{id}}" data-width="{{W}}" data-height="{{H}}" lang="{{lang}}" dir="{{dir}}"
       data-composition-variables='[{"id":"words","type":"string","label":"Words (JSON list of {w,start,end}, seconds from the plate start)","default":"[]"}]'>
    <div id="{{id}}-host" class="clip" data-start="0" data-duration="{{dur}}"></div>
  </div>
  <script>
    (function () {
      const D = {{dur}}, id = "{{id}}", MAXW = {{cap_max_words}}, FAM = "{{cap_font}}";
      let words = window.__hyperframes.getVariables().words || [];
      if (typeof words === "string") { try { words = JSON.parse(words); } catch (e) { words = []; } }
      const host = document.getElementById(id + "-host");
      const groups = []; let cur = [];
      words.forEach(function (w, i) {
        cur.push(w);
        const next = words[i + 1], end = /[.!?؟…]$/.test(w.w) || (next && next.start - w.end >= 0.35);
        if (cur.length >= MAXW || end || !next) { groups.push(cur); cur = []; }
      });
      const tl = gsap.timeline({ paused: true });
      groups.forEach(function (g, gi) {
        const gEl = document.createElement("div"); gEl.className = id + "-g"; gEl.id = id + "-g" + gi;
        const line = document.createElement("div"); line.className = id + "-l" + ("{{cap_bg}}" !== "none" ? " box" : "");
        if (FAM === "persian") line.style.fontFamily = '"EPPersian","EPLatin",sans-serif';
        const spans = g.map(function (w, wi) {
          const s = document.createElement("span"); s.className = id + "-w"; s.id = id + "-w" + gi + "-" + wi; s.textContent = w.w + (wi < g.length - 1 ? " " : "");
          line.appendChild(s); return s;
        });
        gEl.appendChild(line); host.appendChild(gEl);
        const start = Math.max(0.05, g[0].start - 0.06);
        let end = g[g.length - 1].end + 0.12; const nxt = groups[gi + 1]; if (nxt) end = Math.min(end, nxt[0].start - 0.06 + 0.001);
        end = Math.min(Math.max(end, start + 0.25), D - 0.01);
        tl.set(gEl, { visibility: "visible", opacity: 1 }, start);
        tl.fromTo(line, { y: 14 }, { y: 0, duration: 0.14, ease: "power3.out" }, start);
        g.forEach(function (w, wi) {
          tl.set(spans[wi], { color: "{{cap_highlight}}" }, Math.max(start, w.start));
          tl.set(spans[wi], { color: "{{cap_color}}" }, Math.min(end, Math.max(w.end, w.start + 0.12)));
        });
        tl.set(gEl, { opacity: 0, visibility: "hidden" }, end);
      });
      window.__timelines[id] = tl;
    })();
  </script>
</template>

<template>
  <style>
    /*BRAND*/
    #root { position: absolute; inset: 0; font-family: var(--font-text); }
    #{{id}}-plane { position: absolute; inset: 0; background: var(--c-accent); display: flex; align-items: center; justify-content: center; }
    #{{id}}-mark { font-size: calc(var(--u) * var(--s-display) * 1.1); font-weight: var(--display-weight); letter-spacing: var(--tracking); color: var(--c-accent-ink); line-height: 1; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="{{id}}" data-width="{{W}}" data-height="{{H}}" lang="{{lang}}" dir="{{dir}}"
       data-composition-variables='[{"id":"mark","type":"string","label":"Channel mark","default":"Channel"}]'>
    <div id="{{id}}-plane" class="clip" data-start="0" data-duration="{{dur}}"><div id="{{id}}-mark" data-var-text="mark"></div></div>
  </div>
  <script>
    (function () {
      const D = {{dur}}, S = "{{dir}}" === "rtl" ? -1 : 1, id = "{{id}}";
      const v = Object.assign({ mark: "Channel" }, window.__hyperframes.getVariables());
      document.getElementById(id + "-mark").textContent = v.mark;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#" + id + "-plane", { clipPath: S > 0 ? "inset(0 100% 0 0)" : "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0)", duration: 0.4, ease: "power3.inOut" }, 0);
      tl.fromTo("#" + id + "-mark", { opacity: 0, x: -60 * S }, { opacity: 1, x: 0, duration: 0.5, ease: "{{ease_in}}" }, 0.2);
      tl.to("#" + id + "-plane", { clipPath: S > 0 ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)", duration: 0.35, ease: "power3.inOut" }, D - 0.4);
      window.__timelines[id] = tl;
    })();
  </script>
</template>
